# Trucking Sovereign Micro-Frontend Suite — Multi-Container Topology
# Maps all canonical ports (5170, 5171, 5173-5180) to independent containers.

services:
  # Port 5170: Command Center Portal
  command-center-portal:
    build:
      context: .
      dockerfile: deploy/Dockerfile.subproduct
      args:
        PRODUCT_DIR: products/command-center-portal
    ports:
      - "5170:80"
    restart: unless-stopped

  # Port 5171: Loopback Shipment Flow Service
  shipment-flow-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile.shipment-service
    ports:
      - "5171:5171"
    restart: unless-stopped

  # Port 5173: Product 01 Cargo Fit & Load Planning
  product-01-cargo-fit:
